name: Build and Release Magisk Module

# Pushes and pull requests only build and test. A GitHub release is created
# exclusively by pushing a version tag (e.g. `git tag v3.6 && git push origin v3.6`)
# that matches module.prop; an existing release is never modified.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Check version consistency
        run: sh scripts/check-version.sh

      - name: Vet and test
        run: |
          go vet .
          go test -race .

      - name: Build arm64 binary
        run: GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o nfqttl .

      - name: Package module ZIP
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '\r')
          sh scripts/package.sh "$VERSION-dev+${GITHUB_SHA::7}" dist

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-${{ github.sha }}
          path: dist/GKI_Tether_Shield_*.zip
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Verify tag
        run: |
          sh scripts/check-version.sh "$TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$TAG does not point at a commit on main"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump the version instead of rebuilding it"
            exit 1
          fi

      - name: Build and package
        run: |
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o nfqttl .
          sh scripts/package.sh "$TAG" dist
          (cd dist && sha256sum *.zip > SHA256SUMS)

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "## What's Changed in $TAG"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..$TAG" --pretty=format:"* %s (%h)" --no-merges
            else
              git log "$TAG" --pretty=format:"* %s (%h)" --no-merges
            fi
            echo
          } > release-notes.md

      - name: Create GitHub release
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md \
            dist/GKI_Tether_Shield_"$TAG".zip dist/GKI_Hotspot_Shield_"$TAG".zip dist/SHA256SUMS
