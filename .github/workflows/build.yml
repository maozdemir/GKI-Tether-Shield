name: Build and Release Magisk Module

# Every push and pull request builds and tests. A push to main also
# publishes a GitHub release when module.prop carries a version that has no
# release yet (bump module.prop/update.json to release). Existing releases
# are never modified.
#
# The companion APK is built from app/. Release builds are signed with the
# key in the APK_KEYSTORE_B64 / APK_KEYSTORE_PASSWORD / APK_KEY_ALIAS secrets
# when set; otherwise (and for PR builds) a throwaway key is used and the
# installer reinstalls the app on signature changes.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Check version consistency
        run: sh scripts/check-version.sh

      - name: Vet and test
        run: |
          go vet .
          go test -race .

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Build arm64 binary
        run: sh scripts/build.sh

      - name: Build companion APK (throwaway signing key)
        run: sh scripts/build-apk.sh

      - name: Package module ZIP
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '\r')
          sh scripts/package.sh "$VERSION-dev+${GITHUB_SHA::7}" dist

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-${{ github.sha }}
          path: dist/GKI_Tether_Shield_*.zip
          retention-days: 14

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '\r')
          sh scripts/check-version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION already exists and is left untouched. Bump the version in module.prop to publish a new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists without a release; delete the tag or bump the version."
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up JDK
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        if: steps.version.outputs.publish == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Build and package
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          sh scripts/build.sh
          sh scripts/build-apk.sh
          sh scripts/package.sh "$VERSION" dist
          (cd dist && sha256sum *.zip > SHA256SUMS)

      - name: Generate release notes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          {
            echo "## What's Changed in $VERSION"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --pretty=format:"* %s (%h)" --no-merges
            else
              git log --pretty=format:"* %s (%h)" --no-merges
            fi
            echo
          } > release-notes.md

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file release-notes.md \
            dist/GKI_Tether_Shield_"$VERSION".zip dist/GKI_Hotspot_Shield_"$VERSION".zip dist/SHA256SUMS
